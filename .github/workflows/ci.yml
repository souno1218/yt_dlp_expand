name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 毎週月曜 09:00 UTC に統合テストを実行 / Run integration tests every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lint-and-unit:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/

      - name: Type check (mypy)
        run: mypy src/

      - name: Unit and mock tests
        run: pytest tests/unit tests/mock --cov=yt_dlp_expand --cov-report=term-missing -v

  integration:
    name: Integration tests (real downloads)
    runs-on: ubuntu-latest
    # 週次スケジュールまたは手動トリガー時のみ実行
    # Only run on scheduled or manual triggers to avoid frequent network usage.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Integration tests
        run: pytest -m integration tests/integration/ -v
