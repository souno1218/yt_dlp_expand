[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "yt_dlp_expand"
version = "0.4.11"
description = "yt-dlp wrapper for downloading YouTube videos/audio with embedded thumbnails"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "souno1218", email = "supinosaurusuz@gmail.com"},]
dependencies = [
    "yt-dlp[default]",
    "mutagen",
    "ffmpeg-python>=0.2.0",
]

[project.urls]
Homepage = "https://qiita.com/soun1218/items/3f07fbaa7029208dd789"
Repository = "https://github.com/souno1218/yt_dlp_expand"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
yt_dlp_expand = "yt_dlp_expand:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require network access and real downloads (deselect with '-m not integration')",
]
